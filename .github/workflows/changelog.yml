name: Release Automatic changelog

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

jobs:
  changelog:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Delete beta tag
        run: git tag -d beta
        continue-on-error: true

      - run: npx changelogithub # or changelogithub@0.12 if ensure the stable result
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Trigger release build
        # 用 GITHUB_TOKEN 创建的 Release 不会触发 release: published 事件
        # （GitHub 为避免递归触发会抑制该类事件），必须显式 dispatch。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh workflow run release.yml --ref selfuse -f tag="$TAG"
