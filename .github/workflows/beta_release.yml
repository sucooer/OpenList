name: Beta Release builds

# Fork 自用精简版：
# - push dev 自动构建（上游机制只认 main/tag，fork 无 PR 流程）
# - 只产出 Windows amd64 / Linux amd64 / Linux arm64 三个纯 Go 交叉编译产物
# - 前端用 FRONTEND_REPO 的 edge(rolling) 产物（fork 若未设置该 variable 则回退官方前端）
# - 发布为 fork 仓库的 prerelease "beta"

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Beta Release (win-amd64 / linux-amd64 / linux-arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"

      - name: Fetch rolling frontend
        # build.sh 的 "dev web" = 只拉 FRONTEND_REPO 的 edge(rolling) dist 到 public/dist，不做后端构建
        run: bash build.sh dev web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_REPO: ${{ vars.FRONTEND_REPO }}

      - name: Cross-compile binaries (pure Go, no cgo)
        run: |
          set -e
          mkdir -p build
          gitCommit=$(git rev-parse --short HEAD)
          builtAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ldflags="-w -s -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=${builtAt}' -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=OpenList Fork Builder <noreply@github.com>' -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=${gitCommit}' -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.Version=beta' -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=rolling'"
          for t in "linux amd64" "linux arm64" "windows amd64"; do
            os=${t%% *}
            arch=${t##* }
            echo "building $os/$arch"
            if [ "$os" = "windows" ]; then
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o build/openlist-$os-$arch.exe -ldflags="$ldflags" -tags=jsoniter .
            else
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o build/openlist-$os-$arch -ldflags="$ldflags" -tags=jsoniter .
            fi
          done
          ls -lh build/

      - name: Package assets
        # 复用官方 MakeRelease：linux→tar.gz，windows→zip，并生成 md5-beta.txt
        run: bash build.sh zip md5-beta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish beta release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 每次重建 prerelease "beta"，保证 release 指向最新 dev commit
          gh release delete beta --yes --cleanup-tag >/dev/null 2>&1 || true
          git tag -f beta
          git push -f origin beta
          gh release create beta --prerelease --title "Beta Build" --notes "Auto-built from the latest \`dev\` push (fork self-build)." >/dev/null
          for file in build/compress/*; do
            gh release upload beta "$file" --clobber
          done
