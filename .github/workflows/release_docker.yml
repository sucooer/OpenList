name: Release builds (Docker)

# Fork 自用精简版（正式版 Docker）：
# - 触发：push v* tag（打版本号后自动）或 workflow_dispatch 手动输入 tag
# - 只构建 standard 镜像（latest/ffmpeg/aria2/aio 四变体），无 lite
# - 平台收敛 linux/amd64,linux/arm64,linux/arm/v7
# - 镜像推 GHCR(默认当前 owner) + Docker Hub（需配置 vars.DOCKERHUB_ORG_NAME / secrets.DOCKERHUB_TOKEN）
# - 二进制纯 Go 交叉编译（CGO_ENABLED=0，静态），前端用 FRONTEND_REPO 的 edge(rolling)

on:
  workflow_dispatch:
    inputs:
      manual_tag:
        description: 'Tag name (like v0.1.0). Required if as_latest is true.'
        required: false
        type: string
      as_latest:
        description: 'Tag as latest?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_ORG_NAME: ${{ vars.DOCKERHUB_ORG_NAME || secrets.DOCKERHUB_ORG_NAME || github.repository_owner }}
  GHCR_ORG_NAME: ${{ vars.GHCR_ORG_NAME || secrets.GHCR_ORG_NAME || github.repository_owner }}
  IMAGE_NAME: openlist-git
  IMAGE_NAME_DOCKERHUB: openlist
  REGISTRY: ghcr.io
  ARTIFACT_NAME: 'binaries_docker_release'
  RELEASE_PLATFORMS: 'linux/amd64,linux/arm64,linux/arm/v7'
  IMAGE_PUSH: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
  # secrets 不能出现在 step 的 if 里，先在 env 里算成布尔值
  HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}

permissions:
  packages: write

jobs:
  build_binary:
    name: Build Binaries for Docker Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'

      - name: Fetch rolling frontend
        # "dev web" = 只拉 FRONTEND_REPO edge(rolling) dist 到 public/dist
        run: bash build.sh dev web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_REPO: ${{ vars.FRONTEND_REPO || secrets.FRONTEND_REPO || 'sucooer/OpenList-Frontend' }}

      - name: Build static go binaries (pure Go, no cgo)
        run: |
          set -e
          gitCommit=$(git rev-parse --short HEAD)
          builtAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="${{ github.event.inputs.manual_tag }}"
          fi
          ldflags="-w -s -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=${builtAt}' -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=OpenList Fork Builder <noreply@github.com>' -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=${gitCommit}' -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.Version=${tag}' -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=rolling'"
          # Dockerfile.ci 通过 /build/${TARGETPLATFORM}/openlist 取二进制
          build_one() {
            os=$1; arch=$2; goarm=$3; outdir=$4
            mkdir -p "$outdir"
            echo "building $os/$arch${goarm:+ GOARM=$goarm}"
            if [ -n "$goarm" ]; then
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=$goarm go build -trimpath -o "$outdir/openlist" -ldflags="$ldflags" -tags=jsoniter .
            else
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o "$outdir/openlist" -ldflags="$ldflags" -tags=jsoniter .
            fi
          }
          build_one linux amd64 "" "build/linux/amd64"
          build_one linux arm64 "" "build/linux/arm64"
          build_one linux arm 7 "build/linux/arm/v7"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          overwrite: true
          # 必须以 build/ 为根：upload-artifact 会把路径的公共前缀作为 artifact 根，
          # 若写 build/linux/ 则下载后变成 build/amd64/openlist，Dockerfile.ci 的
          # /build/${TARGETPLATFORM}/openlist 就找不到了
          path: |
            build/
            !build/*.tgz

  release_docker:
    needs: build_binary
    name: Release Docker image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["latest", "ffmpeg", "aria2", "aio"]
        include:
          - image: "latest"
            base_image_tag: "base"
            build_arg: ""
            tag_favor: ""
          - image: "ffmpeg"
            base_image_tag: "ffmpeg"
            build_arg: INSTALL_FFMPEG=true
            tag_favor: "suffix=-ffmpeg,onlatest=true"
          - image: "aria2"
            base_image_tag: "aria2"
            build_arg: INSTALL_ARIA2=true
            tag_favor: "suffix=-aria2,onlatest=true"
          - image: "aio"
            base_image_tag: "aio"
            build_arg: |
              INSTALL_FFMPEG=true
              INSTALL_ARIA2=true
            tag_favor: "suffix=-aio,onlatest=true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: 'build/'

      # 必须与 Dockerfile.ci 的 /build/${TARGETPLATFORM}/openlist 一一对应
      - name: Verify binaries
        run: find build -type f -name openlist | sort

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        if: env.IMAGE_PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub Container Registry
        if: env.IMAGE_PUSH == 'true' && env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_ORG_NAME_BACKUP || env.DOCKERHUB_ORG_NAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 没配 DOCKERHUB_TOKEN 时只生成 GHCR 的 tag，避免推送到未登录的 Docker Hub 而失败
      - name: Docker meta (GHCR only)
        if: env.HAS_DOCKERHUB != 'true'
        id: meta_ghcr
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.GHCR_ORG_NAME }}/${{ env.IMAGE_NAME }}
          tags: >
            ${{ github.event_name == 'workflow_dispatch'
                && format('type=raw,value={0}', github.event.inputs.manual_tag)
              || format('type=raw,value={0}', github.ref_name) }}
          flavor: |
            latest=${{ github.event_name == 'push' || github.event.inputs.as_latest == 'true' }}
            ${{ matrix.tag_favor }}

      - name: Docker meta (GHCR + DockerHub)
        if: env.HAS_DOCKERHUB == 'true'
        id: meta_all
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.GHCR_ORG_NAME }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_ORG_NAME }}/${{ env.IMAGE_NAME_DOCKERHUB }}
          tags: >
            ${{ github.event_name == 'workflow_dispatch'
                && format('type=raw,value={0}', github.event.inputs.manual_tag)
              || format('type=raw,value={0}', github.ref_name) }}
          flavor: |
            latest=${{ github.event_name == 'push' || github.event.inputs.as_latest == 'true' }}
            ${{ matrix.tag_favor }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.ci
          push: ${{ env.IMAGE_PUSH == 'true' }}
          build-args: |
            BASE_IMAGE_TAG=${{ matrix.base_image_tag }}
            ${{ matrix.build_arg }}
          tags: ${{ env.HAS_DOCKERHUB == 'true' && steps.meta_all.outputs.tags || steps.meta_ghcr.outputs.tags }}
          labels: ${{ env.HAS_DOCKERHUB == 'true' && steps.meta_all.outputs.labels || steps.meta_ghcr.outputs.labels }}
          platforms: ${{ env.RELEASE_PLATFORMS }}
